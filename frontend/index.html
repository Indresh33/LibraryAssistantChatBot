<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>📚 Library Assistant Bot</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: linear-gradient(135deg, #0f172a, #020617);
      color: #e5e7eb;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .chat-app {
      width: 420px;
      max-width: 95%;
      height: 640px;
      background: #020617;
      border-radius: 18px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid #1e293b;
    }

    .header {
      padding: 14px 16px;
      background: linear-gradient(90deg, #1d4ed8, #2563eb);
      font-weight: 600;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header span {
      font-size: 18px;
    }

    .messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      background: #020617;
    }

    .msg {
      max-width: 80%;
      margin-bottom: 12px;
      padding: 10px 14px;
      border-radius: 14px;
      line-height: 1.4;
      font-size: 14.5px;
      white-space: pre-wrap;
    }

    .user {
      background: #2563eb;
      margin-left: auto;
      border-bottom-right-radius: 4px;
    }

    .bot {
      background: #1e293b;
      margin-right: auto;
      border-bottom-left-radius: 4px;
    }

    .typing {
      font-style: italic;
      opacity: 0.7;
    }

    .input-bar {
      display: flex;
      padding: 10px;
      border-top: 1px solid #1e293b;
      background: #020617;
    }

    .input-bar input {
      flex: 1;
      padding: 10px 12px;
      border-radius: 12px;
      border: none;
      outline: none;
      background: #020617;
      color: #e5e7eb;
      border: 1px solid #1e293b;
      font-size: 14px;
    }

    .input-bar button {
      margin-left: 8px;
      padding: 10px 16px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      font-weight: 600;
      transition: 0.2s ease;
    }

    .input-bar button:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(37,99,235,0.35);
    }

    .hint {
      padding: 8px 12px;
      font-size: 12px;
      color: #9ca3af;
      border-top: 1px dashed #1e293b;
      background: #020617;
    }
  </style>
</head>
<body>

  <div class="chat-app">
    <div class="header">
      <span>📚</span>
      Library Assistant Bot
    </div>

    <div id="messages" class="messages"></div>

    <div class="input-bar">
      <input id="input" type="text" placeholder="Ask about books, borrowing, rules..." autocomplete="off" />
      <button onclick="sendMessage()">Send</button>
    </div>

    <div class="hint">
      Try: "Search Clean Code", "Issue book 2", "Return book 2", "Library rules"
    </div>
  </div>

  <script>
    const messagesDiv = document.getElementById("messages");
    const input = document.getElementById("input");

    function addMessage(text, cls) {
      const div = document.createElement("div");
      div.className = `msg ${cls}`;
      div.textContent = text;
      messagesDiv.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function addTyping() {
      const div = document.createElement("div");
      div.className = "msg bot typing";
      div.id = "typing";
      div.textContent = "Library assistant is typing...";
      messagesDiv.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function removeTyping() {
      const t = document.getElementById("typing");
      if (t) t.remove();
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, "user");
      input.value = "";
      addTyping();

      try {
        const res = await fetch("http://127.0.0.1:8000/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text })
        });

        const data = await res.json();
        removeTyping();
        addMessage(data.reply, "bot");
      } catch (err) {
        removeTyping();
        addMessage("⚠️ Server error. Is backend running?", "bot");
      }
    }

    input.addEventListener("keydown", e => {
      if (e.key === "Enter") sendMessage();
    });

    // Welcome message
    addMessage("👋 Hello! I'm your Library Assistant. Ask me about books, borrowing, or library rules.", "bot");
  </script>

</body>
</html>
